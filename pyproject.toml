[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant-juridique-retrieval"
version = "0.1.0"
description = "Recherche hybride et API pour un assistant juridique RAG"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["legal_rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
